name: Render manuscript

# Rebuilds the whole targets pipeline and renders manuscript/ on every push
# and PR - catches the class of bug this template has hit by hand (docx
# corruption, one bad image format silently stalling html/docx too, a
# render that works locally but not from a clean checkout) automatically,
# instead of only when someone remembers to render all three formats. See
# manuscript/supplementary/ci-pipeline.qmd for the full writeup.
#
# On push to main only, also deploys manuscript/output/ to GitHub Pages
# (Settings → Pages → Source: GitHub Actions, already enabled) via the
# artifact-based deploy, not a gh-pages branch - chosen for no git-history
# bloat from rendered output; cheap to swap for quarto-actions/publish
# later if that tradeoff ever stops making sense, since the two approaches
# don't share any state. PRs render and test but never deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual redeploy button, no empty commit needed

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    # Local renders finish in ~4 minutes; GitHub's default job timeout is
    # 6 hours, which is how a hung headless-Chrome mermaid render burned
    # ~3 hours before someone noticed and cancelled it manually. Fail fast
    # instead - see manuscript/supplementary/ci-pipeline.qmd.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # No DESCRIPTION file (this isn't an R package) - the package list
      # lives in R/required_packages.R instead, also sourced by runme.R,
      # so there's exactly one place to add a package for a new notebook
      # rather than two hand-synced copies (a real gap found in practice:
      # a new notebook's dependency was added to runme.R's local install
      # but not here, and CI failed on a `library()` call runme.R never
      # would have caught either, since two of its three new packages
      # happened to already be installed on the machine that ran it).
      # Only base R is needed to read the list, so this runs before any
      # package - including this project's own - is installed.
      - name: Read required R packages
        id: required-packages
        run: |
          {
            echo 'list<<PKGLIST_EOF'
            Rscript -e 'source("R/required_packages.R"); cat(required_pkgs, sep="\n")'
            echo 'PKGLIST_EOF'
          } >> "$GITHUB_OUTPUT"

      # setup-r-dependencies, not runme.R's plain install.packages() -
      # this also resolves and installs the Ubuntu system libraries these
      # packages need (libcurl, libmagick++, Cairo, ...) via pak's sysreqs
      # database and pulls pre-built RSPM binaries. install.packages()
      # does neither, so pointing CI at runme.R directly would trade
      # "missing R package" for "fails to compile from source because the
      # system lib isn't there" - a worse failure mode, not a fix.
      #
      # dependencies: '"hard"' - a second, real incident, not defensive
      # styling: this action's own default ("all") resolves Suggests too,
      # not just Imports/Depends/LinkingTo - install.packages() (what
      # runme.R and local testing use) never touches Suggests, so this
      # gap is invisible locally the same way the missing-package
      # incident above was. It surfaced when `tidygraph` (a direct
      # dependency here, for diagrams-mre.qmd) was resolved with its full
      # Suggests list, which includes `NetSwan` - archived from CRAN on
      # 2025-01-26 (confirmed: `tidygraph`'s own installed DESCRIPTION
      # lists it under Suggests), and pak's *lockfile* solver treats one
      # unresolvable package anywhere in the requested set as a hard
      # failure for the whole lockfile, not just that one package - the
      # CI error listed "dependency conflict" against every package in
      # the list, not just tidygraph/NetSwan. `dependencies: '"hard"'`
      # restricts pak to Imports/Depends/LinkingTo only, matching
      # install.packages()'s own behaviour and confirmed (by inspecting
      # tidygraph's DESCRIPTION directly) to never reach NetSwan at all.
      # **Not independently reproduced end-to-end locally** - a local
      # `pak::lockfile_create(dependencies = "all")` against this
      # project's required package list actually succeeded, because local
      # resolves against plain CRAN (source-capable, still serves
      # archived packages from CRAN's Archive/), while CI's
      # `use-public-rspm: true` above serves binary-only snapshots that
      # don't mirror archived packages - confirmed via `pak::repo_status()`
      # showing a plain "cran"-type repo locally, not RSPM. Same nominal
      # request, genuinely different outcome depending on which repo
      # backend answers it - "it resolved on my machine" isn't evidence
      # it'll resolve in CI for an archived-package case like this one,
      # same spirit as (but a different mechanism from) the PATH-based
      # process-mismatch gotcha elsewhere in this file/CLAUDE.md.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.required-packages.outputs.list }}
          dependencies: '"hard"'

      - uses: quarto-dev/quarto-actions/setup@v2

      # Hypothesis fix, not yet confirmed in actual CI: a real run hung
      # for ~3h at render_manuscript and was cancelled manually, with
      # orphaned chrome/chrome_crashpad_handler/deno processes left behind
      # at cleanup. Quarto renders this repo's mermaid diagrams
      # (diagrams-mre.qmd, rendering-pipeline.qmd) to PNG for docx/typst via
      # a Deno-managed "chrome-headless-shell" (confirmed as a real,
      # separate ~115MB download via `quarto install chrome-headless-shell`,
      # tested directly in this session - "chromium" is the older, legacy
      # target name), downloaded/launched lazily on first use - that
      # almost certainly hung mid-render rather than failing cleanly.
      # Pre-installing it here, as its own visible step with output and
      # (via timeout-minutes above) a hard time limit, should surface a
      # download/launch problem quickly instead of silently stalling
      # render_manuscript for hours. See
      # manuscript/supplementary/ci-pipeline.qmd for the full writeup - the
      # download itself was confirmed to work in this session, but NOT
      # whether this actually fixes the CI hang; the next CI run is what
      # tests that part.
      - name: Install Quarto's headless Chrome (mermaid → docx/typst)
        run: quarto install chrome-headless-shell --no-prompt

      # Closes the one documented-but-unverified-locally gap: without
      # rsvg-convert, docx SVG embedding has no raster fallback (see
      # images-mre.qmd). Installing it here means CI's docx render is
      # actually clean, not just "didn't error."
      - name: Install rsvg-convert (docx SVG embedding)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Import example raw data
        run: Rscript -e 'source("data-raw/import-data.R")'

      - name: Build pipeline and render manuscript
        run: Rscript -e 'targets::tar_make()'

      # Uploaded even on failure (if: always()) - a stale/partial
      # output/ is itself useful for debugging the exact "one format
      # failed, others look fine" gotcha documented in CLAUDE.md.
      - name: Upload rendered manuscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-output
          path: manuscript/output/
          if-no-files-found: ignore

      # Separate from the debug artifact above - upload-pages-artifact
      # packages output specifically for actions/deploy-pages in the
      # deploy job below. Only on a real render (no if: always()) and only
      # for main/dispatch, never PRs - a broken render shouldn't publish,
      # and a PR shouldn't touch the live site at all.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: manuscript/output/

  deploy:
    needs: render
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
